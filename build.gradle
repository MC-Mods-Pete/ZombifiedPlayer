plugins {
	id 'fabric-loom' version '1.9-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
mod_name = project.mod_name
mod_id = project.mod_id
loader_version = project.loader_version
minecraft_version_range = project.minecraft_version_range
java_version_range = project.java_version_range
cloth_config_version = project.cloth_config_version
modmenu_version = project.modmenu_version
jade_version = project.jade_version
contagion_version = project.contagion_version
undeadnights_version = project.undeadnights_version
cardinal_components_version = project.cardinal_components_version

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url "https://maven.shedaniel.me/"}
	maven {
		name = "ParchmentMC"
		url = "https://maven.parchmentmc.org"
	}
	maven { url "https://maven.terraformersmc.com/releases/"}


	maven {
		name 'Ladysnake Mods'
		url 'https://maven.ladysnake.org/releases'
	}
	maven {
		name 'Wispforest'
		url 'https://maven.wispforest.io/'
	}
	maven {
		name 'Architectury'
		url 'https://maven.architectury.dev/'
	}
	maven {
		name 'Jamalam'
		url 'https://maven.jamalam.tech/releases/'
	}
	maven {
		name 'Modrinth'
		url 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		name 'Nucleoid'
		url 'https://maven.nucleoid.xyz/'
	}
}

fabricApi {
	configureDataGeneration()
}

loom {
	runs {
		// headless GameTest server: runs the tests registered under the entrypoint "fabric-gametest", then exits
		gametest {
			inherit server
			name "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/junit.xml"
			runDir "run"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${project.parchment_minecraft_version}:${project.parchment_mappings_version}@zip")
	}
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	include "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

	//other dependencies
	modImplementation "maven.modrinth:jade:${project.jade_version}"
	modImplementation "maven.modrinth:contagion:${project.contagion_version}"
	// compile only: Undead Nights 2.1.1 has an own method setDirty() that calls the vanilla one (method_80); under Mojang
	// names both are setDirty, so in the dev environment it calls itself (StackOverflowError on the first server tick).
	// The released jar (intermediary names) is not affected.
	modCompileOnly "maven.modrinth:undead-nights:${project.undeadnights_version}"

	modImplementation "maven.modrinth:trinkets:${project.trinkets_version}"

	modImplementation "maven.modrinth:pneumono_core:${project.pneumono_core_version}"

	// Both gravestone mods are available for compilation (for their respective util classes)
	modCompileOnly "maven.modrinth:pneumono_gravestones:${project.pneumono_gravestones_version}"
	modCompileOnly "maven.modrinth:universal-graves:${project.universal_graves_version}"

	// Control which mod is active during runClient via gradle.properties:
	//   active_graves_mod=universal_graves       → load Universal Graves
	//   active_graves_mod=pneumono_gravestones   → load Pneumono Gravestones
	if ((project.findProperty('active_graves_mod') ?: 'universal_graves') == 'pneumono_gravestones') {
		modLocalRuntime "maven.modrinth:pneumono_gravestones:${project.pneumono_gravestones_version}"
		logger.lifecycle("[ZombifiedPlayer] Active graves mod: pneumono_gravestones")
	} else {
		modLocalRuntime "maven.modrinth:universal-graves:${project.universal_graves_version}"
		logger.lifecycle("[ZombifiedPlayer] Active graves mod: universal_graves")
	}

	modImplementation "maven.modrinth:accessories:${project.accessories_version}"
	modImplementation "maven.modrinth:owo-lib:${project.owo_lib_version}"
	// endec is jar-in-jar in owo-lib, Loom does not load nested jars in the dev environment: the versions owo-lib bundles
	modImplementation "io.wispforest:endec:0.1.5.1"
	modImplementation "io.wispforest.endec:gson:0.1.3.1"
	modImplementation "io.wispforest.endec:netty:0.1.2"
	modLocalRuntime "io.wispforest.endec:jankson:0.1.3.1"
	// Sodium needed in dev env to satisfy accessories' optional Sodium mixin
	modLocalRuntime "maven.modrinth:sodium:u1OEbNKx"

	// Universal Graves bundles Polymer and friends as jar-in-jar, Loom does not load nested jars in the dev environment:
	// the same libraries from the Nucleoid maven (were local jars in libs/ before)
	modLocalRuntime "eu.pb4:polymer-core:0.9.14+1.21.1"
	modLocalRuntime "eu.pb4:polymer-common:0.9.14+1.21.1"
	modLocalRuntime "eu.pb4:polymer-networking:0.9.14+1.21.1"
	modLocalRuntime "eu.pb4:polymer-reg-sync-manipulator:0.9.14+1.21.1"
	modLocalRuntime "eu.pb4:polymer-resource-pack:0.9.14+1.21.1"
	modLocalRuntime "eu.pb4:polymer-virtual-entity:0.9.14+1.21.1"
	modLocalRuntime "eu.pb4:placeholder-api:2.4.1+1.21"
	modLocalRuntime "eu.pb4:sgui:1.6.0+1.21"
	modLocalRuntime "eu.pb4:predicate-api:0.5.1+1.21"
	modLocalRuntime "eu.pb4:common-protection-api:1.0.0"
	modLocalRuntime "xyz.nucleoid:server-translations-api:2.3.1+1.21-pre2"
	modLocalRuntime "xyz.nucleoid:packet-tweaker:0.5.5+1.21"
	modLocalRuntime "maven.modrinth:fabric-permissions-api:62DUD085"

    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${cardinal_components_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${cardinal_components_version}"
}

processResources {
	inputs.property "version", version
	inputs.property "mod_id", mod_id
	inputs.property "mod_name", mod_name
	inputs.property "loader_version", loader_version
	inputs.property "minecraft_version_range", minecraft_version_range
	inputs.property "java_version_range", java_version_range
	inputs.property "cloth_config_version", cloth_config_version
	inputs.property "modmenu_version", modmenu_version
	inputs.property "jade_version", jade_version
	inputs.property "contagion_version", contagion_version
	inputs.property "undeadnights_version", undeadnights_version

	filesMatching("fabric.mod.json") {
		expand "version": version, "mod_id": mod_id, "mod_name": mod_name, "loader_version": loader_version,
				"minecraft_version_range": minecraft_version_range, "java_version_range": java_version_range,
				"cloth_config_version" : cloth_config_version, "modmenu_version": modmenu_version,
				"jade_version": jade_version, "contagion_version": contagion_version,
				"undeadnights_version": undeadnights_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
		maven {
			url = project.findProperty("maven.url") ?: System.getenv("MAVEN_URL")
			credentials {
				username=project.findProperty("maven.user") ?: System.getenv("MAVEN_USER")
				password=project.findProperty("maven.password") ?: System.getenv("MAVEN_PASSWORD")
			}
		}
	}
}
