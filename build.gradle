plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
mod_name = project.mod_name
mod_id = project.mod_id
loader_version = project.loader_version
minecraft_version_range = project.minecraft_version_range
java_version_range = project.java_version_range
cloth_config_version = project.cloth_config_version
modmenu_version = project.modmenu_version
jade_version = project.jade_version
contagion_version = project.contagion_version
undeadnights_version = project.undeadnights_version
cardinal_components_version = project.cardinal_components_version

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url "https://maven.shedaniel.me/"}
	maven { url "https://maven.terraformersmc.com/releases/"}

	maven {
		name = 'Ladysnake Mods'
		url = 'https://maven.ladysnake.org/releases'
	}

	maven {
		name = "Nucleoid"
		url = 'https://maven.nucleoid.xyz/releases'
	}

	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

fabricApi {
	configureDataGeneration()
}

loom {
	runs {
		// headless GameTest server: runs the tests registered under the entrypoint "fabric-gametest", then exits
		gametest {
			inherit server
			name "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/junit.xml"
			runDir "run"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	include "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

	//other dependencies (dev environment only, see gradle.properties)
	implementation "maven.modrinth:jade:${project.jade_version}"
	implementation "maven.modrinth:contagion:${project.contagion_version}"
	implementation "maven.modrinth:undead-nights:${project.undeadnights_version}"

	implementation "eu.pb4:trinkets:${project.trinkets_version}"
	implementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${cardinal_components_version}"
	implementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${cardinal_components_version}"

	// Both gravestone mods are available for compilation (for their respective util classes)
	compileOnly "maven.modrinth:pneumono_gravestones:${project.pneumono_gravestones_version}"
	compileOnly "maven.modrinth:universal-graves:${project.universal_graves_version}"

	// Hardcore Revival API (Balm events), compile only: the mod stays optional
	compileOnly "maven.modrinth:hardcore-revival:${project.hardcore_revival_version}"
	compileOnly "maven.modrinth:balm:${project.balm_version}"
}

processResources {
	inputs.property "version", version
	inputs.property "mod_id", mod_id
	inputs.property "mod_name", mod_name
	inputs.property "loader_version", loader_version
	inputs.property "minecraft_version_range", minecraft_version_range
	inputs.property "java_version_range", java_version_range
	inputs.property "cloth_config_version", cloth_config_version
	inputs.property "modmenu_version", modmenu_version
	inputs.property "jade_version", jade_version
	inputs.property "contagion_version", contagion_version
	inputs.property "undeadnights_version", undeadnights_version

	filesMatching("fabric.mod.json") {
		expand "version": version, "mod_id": mod_id, "mod_name": mod_name, "loader_version": loader_version,
				"minecraft_version_range": minecraft_version_range, "java_version_range": java_version_range,
				"cloth_config_version" : cloth_config_version, "modmenu_version": modmenu_version,
				"jade_version": jade_version, "contagion_version": contagion_version,
				"undeadnights_version": undeadnights_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
		maven {
			url = project.findProperty("maven.url") ?: System.getenv("MAVEN_URL")
			credentials {
				username=project.findProperty("maven.user") ?: System.getenv("MAVEN_USER")
				password=project.findProperty("maven.password") ?: System.getenv("MAVEN_PASSWORD")
			}
		}
	}
}
